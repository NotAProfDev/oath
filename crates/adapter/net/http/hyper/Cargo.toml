[package]
name = "oath-adapter-net-http-hyper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
oath-adapter-net-api = { workspace = true }
oath-adapter-net-http-api = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
hyper-rustls = { workspace = true }
rustls = { workspace = true }
# `time` — the `TokioTimer` clock; `sync` — the `Notify` behind `HyperLeaf::shutdown`.
tokio = { workspace = true, features = ["time", "sync"] }

[dev-dependencies]
# Tests spin loopback servers: `#[tokio::test]` (macros+rt), `spawn` (rt),
# `TcpListener` (net), `AsyncReadExt`/`AsyncWriteExt` (io-util), `start_paused`
# (test-util). `time` is inherited from the prod dep above.
tokio = { workspace = true, features = [
  "macros",
  "rt",
  "net",
  "io-util",
  "test-util",
] }
hyper = { workspace = true, features = ["server"] }
rcgen = { workspace = true }
tokio-rustls = { workspace = true }

[lints]
workspace = true
