name: 🐛 Bug Report
description: Report a bug or unexpected behaviour in OATH
title: "[Bug] <short description>"
labels: ["bug", "needs-triage"]
assignees: [NotAProfDev]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the bug you encountered.
      options:
        - label: I have searched the existing issues
          required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severely does this bug impact your workflow?
      options:
        - P0 (system down / data loss)
        - P1 (major feature broken, no workaround)
        - P2 (minor feature broken, workaround exists)
        - P3 (cosmetic / low-impact)
      default: 2
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Best-guess crate or subsystem. A maintainer applies the matching label during triage.
      options:
        - "Unsure / other"
        - "oath-model"
        - "oath-net"
        - "oath-messaging"
        - "oath-persistence"
        - "oath-ingest"
        - "oath-execution"
        - "oath-portfolio"
        - "oath-risk"
        - "oath-strategy"
        - "oath-engine"
        - "tooling / CI"
        - "docs"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reliably reproduce the behaviour.
      placeholder: |
        1. Configure X with ...
        2. Call Y with ...
        3. Observe ...
        4. (Optional) Paste a minimal code snippet here
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include any error messages or panic output.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide information about your environment.
      placeholder: |
        - OS: [e.g. Linux, macOS, Windows]
        - Rust: [e.g. 1.85.0]
        - OATH version: [e.g. 0.1.0 or git SHA]
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste any error messages, panic output, or backtraces. This is rendered as code, so no backticks needed.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context or screenshots.
