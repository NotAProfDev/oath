name: ✨ Feature Request
description: Propose a new feature or improvement to OATH
title: "[Feature] <short description>"
labels: ["enhancement", "needs-triage"]
assignees: [NotAProfDev]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe your idea in detail.

  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the feature you are requesting.
      options:
        - label: I have searched the existing issues
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve, or what need does it address?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution or example
      description: Describe the feature or change you have in mind. If possible, include a minimal code example or mockup.
      placeholder: |
        (Optional) Paste a minimal code snippet or example here
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you considered and why you ruled them out.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, references, or prior art.
