# Dependabot configuration.
# Full reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Opens weekly PRs for outdated dependencies across all three package ecosystems.
# Cargo.lock is committed and every CI/just recipe runs with `--locked`, so the
# cargo updates refresh both the Cargo.toml constraints and the Cargo.lock entries.
version: 2
updates:
  # Rust crate dependencies — updates Cargo.toml constraints and the committed Cargo.lock.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # GitHub auto-creates the "dependencies" label on the first Dependabot PR.
    labels: ["dependencies"]
    # Batch all crate bumps into one PR per week instead of one PR per crate.
    groups:
      rust-crates:
        patterns: ["*"]

  # GitHub Actions — pins action versions in .github/workflows/*.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(actions)"
    labels: ["ci"]
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # dtolnay/rust-toolchain uses the @ref as the Rust version to install,
      # not as a semver action release. @stable always resolves to latest stable
      # (no update needed), and @1.85 is our intentional MSRV pin (must only
      # change when we deliberately raise the MSRV — not via Dependabot).
      - dependency-name: "dtolnay/rust-toolchain"

  # Dev container features — updates feature versions in devcontainer.json and
  # regenerates devcontainer-lock.json with fresh digests.
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(devcontainer)"
    labels: ["ci"]
    groups:
      devcontainer-features:
        patterns: ["*"]
