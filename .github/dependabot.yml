# Dependabot configuration.
# Full reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Opens weekly PRs for outdated dependencies across all three package ecosystems.
# Cargo.lock is committed and every CI/just recipe runs with `--locked`, so the
# cargo updates refresh both the Cargo.toml constraints and the Cargo.lock entries.
version: 2
updates:
  # Rust crate dependencies — updates Cargo.toml constraints and the committed Cargo.lock.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # 5 is also the version-update default; set explicitly so the cap is visible.
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # GitHub auto-creates the "dependencies" label on the first Dependabot PR.
    labels: ["dependencies"]
    # Don't bump to a release on its first day — gives yanks/regressions time to
    # surface before we pull a new version in.
    cooldown:
      default-days: 7
    # Batch minor/patch crate bumps into one PR per week. Major bumps are
    # excluded from the group so each lands as its own reviewable PR — a breaking
    # major can then fail CI without blocking the safe batch.
    groups:
      rust-crates:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions — pins action versions in .github/workflows/*.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(actions)"
    labels: ["ci"]
    # Same first-day cooldown as cargo above — let yanks/regressions surface
    # before a freshly-published action version is proposed.
    cooldown:
      default-days: 7
    # Group minor/patch action bumps; major bumps land as individual PRs.
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # dtolnay/rust-toolchain is SHA-pinned to a `master` commit; the workflows
      # pick the Rust version via the `toolchain` input (only `master` exposes
      # that input — the per-version branches bake the version in and drop it).
      # The action publishes no semver releases, so Dependabot has no release
      # stream to track here, and the pinned SHA must change only via a
      # deliberate, reviewed bump.
      - dependency-name: "dtolnay/rust-toolchain"

  # Dev container features — updates feature versions in devcontainer.json and
  # regenerates devcontainer-lock.json with fresh digests.
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(devcontainer)"
    labels: ["ci"]
    # Same first-day cooldown as cargo above — let yanks/regressions surface
    # before a freshly-published feature version is proposed.
    cooldown:
      default-days: 7
    # Group minor/patch feature bumps; major bumps land as individual PRs.
    groups:
      devcontainer-features:
        patterns: ["*"]
        update-types: ["minor", "patch"]
