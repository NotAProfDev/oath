# Cargo configuration for this workspace.
# Full reference: https://doc.rust-lang.org/cargo/reference/config.html

# --- Aliases ---
# Short-hand commands for the most common development workflows.
# Usage: cargo <alias>  (e.g. `cargo ca`)
[alias]
# Type-check every crate and target (bins, tests, benches, examples) without codegen.
ca = "check --workspace --all-targets"
# Run Clippy across every crate and target; -D warnings turns warnings into errors.
la = "clippy --workspace --all-targets -- -D warnings"
# Run the full test suite across every workspace crate.
ta = "test --workspace"
# Run cargo-deny to check licenses, bans, advisories, and sources.
da = "deny --all-features check"
# Point Git at the project's hook directory. Run once after cloning (automatic in devcontainer).
setup = "!git config core.hooksPath .githooks"
