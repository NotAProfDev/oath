# Cargo workspace manifest.
# Full reference: https://doc.rust-lang.org/cargo/reference/workspaces.html

[workspace]
resolver = "3"
members = [
  "crates/model",
  "crates/adapter/net/api",
  "crates/adapter/net/http/api",
  "crates/adapter/net/http/mock",
  "crates/adapter/net/ws/api",
  "crates/adapter/net/ws/mock",
  "crates/bus/api",
  "crates/event-log/api",
  "crates/persistence/api",
  "crates/core/api",
  "crates/core/execution",
  "crates/core/portfolio",
  "crates/core/risk",
  "crates/core/kernel",
  "crates/core/host",
  "crates/strategy/api",
  "crates/adapter/api",
  "crates/strategy/host",
  "crates/cli",
  "crates/supervisor",
]

# --- Package metadata ---
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NotAProfDev/oath"
description = "A modular, backend-agnostic trading engine"
readme = "README.md"
keywords = ["trading", "engine", "finance", "async", "backend-agnostic"]
categories = ["finance", "asynchronous"]

# --- Dependencies ---
[workspace.dependencies]
# Internal crates — version is required so cargo-deny can resolve the dep and
# does not treat { workspace = true } path deps as wildcard requirements.
oath-model = { path = "crates/model", version = "0.1.0" }
oath-adapter-net-api = { path = "crates/adapter/net/api", version = "0.1.0" }
oath-adapter-net-http-api = { path = "crates/adapter/net/http/api", version = "0.1.0" }
oath-adapter-net-http-mock = { path = "crates/adapter/net/http/mock", version = "0.1.0" }
oath-adapter-net-ws-api = { path = "crates/adapter/net/ws/api", version = "0.1.0" }
oath-adapter-net-ws-mock = { path = "crates/adapter/net/ws/mock", version = "0.1.0" }
oath-bus-api = { path = "crates/bus/api", version = "0.1.0" }
oath-event-log-api = { path = "crates/event-log/api", version = "0.1.0" }
oath-persistence-api = { path = "crates/persistence/api", version = "0.1.0" }
oath-core-execution = { path = "crates/core/execution", version = "0.1.0" }
oath-core-portfolio = { path = "crates/core/portfolio", version = "0.1.0" }
oath-core-risk = { path = "crates/core/risk", version = "0.1.0" }
oath-strategy-api = { path = "crates/strategy/api", version = "0.1.0" }
oath-adapter-api = { path = "crates/adapter/api", version = "0.1.0" }
oath-core-api = { path = "crates/core/api", version = "0.1.0" }
oath-core-kernel = { path = "crates/core/kernel", version = "0.1.0" }

# External shared — backend-specific deps belong in individual crate Cargo.toml files
# Runtime-neutral last-value channel (extracted from tokio::sync::watch,
# event-listener family) — keeps tokio out of net-ws-api (ADR-0033 §5).
async-watch = "0.3"
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
pin-project-lite = "0.2"
futures-core = { version = "0.3", default-features = false }
futures-sink = { version = "0.3", default-features = false }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
proptest = "1"
serde_json = "1"

# --- Lints ---
# Centralized lint configuration inherited by all workspace crates via `[lints] workspace = true`.
# Full reference: https://doc.rust-lang.org/cargo/reference/workspaces.html#the-lints-table
[workspace.lints.rust]
# Memory safety is a core requirement for a financial engine — deny unsafe
# workspace-wide. A crate that genuinely needs FFI overrides this in its own
# `[lints]` table, with justification — denied by default, escapable on purpose.
unsafe_code = "deny"
unused_imports = "warn"
dead_code = "warn"
missing_docs = "warn"
# Flag `pub` items that aren't actually reachable outside the crate.
unreachable_pub = "warn"
# Modern idioms — a lint *group*, so it needs `priority = -1` to stay below the
# individual lints above (a targeted lint / `#[allow(...)]` always wins).
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Lint groups. `priority = -1` keeps each group below the individual lints further
# down, so a targeted lint / `#[allow(...)]` / per-crate override always wins.
all = { level = "deny", priority = -1 }      # correctness, suspicious, style, complexity, perf — hard error
pedantic = { level = "warn", priority = -1 } # broader, occasionally noisy guidance — visible, non-blocking
nursery = { level = "warn", priority = -1 }  # newer, still-stabilizing lints — advisory
cargo = { level = "warn", priority = -1 }    # manifest hygiene (feature names, wildcard deps, …)
# Internal workspace crates are not published to crates.io
cargo_common_metadata = { level = "allow", priority = 1 }
# Transitive deps may carry duplicate versions outside our control
multiple_crate_versions = { level = "allow", priority = 1 }
# In the restriction group (not covered by `all`) — a committed dbg!() is always
# a mistake, so block it outright rather than merely warning.
dbg_macro = "deny"
# Panicking in a function that returns Result is always a bug.
panic_in_result_fn = "warn"
# Enforce explicit error handling — no silent panics from unwrap/expect/indexing.
# Test code is exempted via `allow-*-in-tests = true` in .clippy.toml.
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
# `arithmetic_side_effects` (overflow/underflow panics) is valuable for financial
# math code but too noisy at the workspace level — enable per-crate as needed.
# `todo` / `unimplemented` / `unreachable` block normal development iteration;
# consider enabling on a crate-by-crate basis once the codebase stabilises.

# --- Profiles ---
# Full reference: https://doc.rust-lang.org/cargo/reference/profiles.html
#
# [profile.dev] is intentionally omitted — Cargo defaults are ideal for development:
#   opt-level=0  debug=true  overflow-checks=true  debug-assertions=true
#   incremental=true  codegen-units=256  panic="unwind"
[profile.release]
# (Default: false) — keep arithmetic overflow checks on even in release. A silent
# wraparound in financial math is a correctness bug, not a performance trade-off
# worth making; the overhead is negligible relative to the safety it buys.
overflow-checks = true
# (Default: false) — whole-program optimization for maximum runtime performance.
lto = "fat"
# (Default: 16) — single codegen unit required for full LTO effectiveness.
codegen-units = 1
# (Default: "unwind") — abort on panic in production; eliminates unwinding overhead.
panic = "abort"
# (Default: "none") — strip all symbols to minimize binary size in production.
strip = "symbols"

# Profiling: release-level performance with debug symbols and without LTO,
# for faster iterative builds and human-readable profiler output (perf, flamegraph).
[profile.profiling]
inherits = "release"
# (Default in release: false) — full debug info for stack trace resolution.
debug = true
# (Default in release: "symbols") — keep symbols for profiler resolution.
strip = "none"
# (Default in release: "fat") — disabled to speed up iterative profiling builds.
lto = false
# (Default in release: false) — incremental compilation for faster iteration.
incremental = true

# Bench: same rationale as profiling — release optimizations with debug symbols
# so that cargo-flamegraph and similar tools produce readable stack traces.
# Note: Cargo ignores the `panic` setting for bench (harness requires unwind).
[profile.bench]
inherits = "release"
# (Default in release: false) — full debug info for stack trace resolution.
debug = true
# (Default in release: "symbols") — keep symbols for profilers.
strip = "none"
# (Default in release: "fat") — disabled to speed up benchmark compilation.
lto = false
# (Default in release: false) — incremental compilation for faster iteration.
incremental = true
