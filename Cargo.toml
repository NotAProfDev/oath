# Cargo workspace manifest.
# Full reference: https://doc.rust-lang.org/cargo/reference/workspaces.html

[workspace]
resolver = "2"
members = [
    "crates/model",
    "crates/net/core",
    "crates/messaging/core",
    "crates/persistence/core",
    "crates/ingest/core",
    "crates/execution/core",
    "crates/portfolio/core",
    "crates/risk/core",
    "crates/strategy/core",
    "crates/engine",
]

# --- Package metadata ---
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A modular, backend-agnostic trading engine"

# --- Dependencies ---
[workspace.dependencies]
# Internal crates — version is required so cargo-deny can resolve the dep and
# does not treat { workspace = true } path deps as wildcard requirements.
oath-model            = { path = "crates/model",            version = "0.1.0" }
oath-net-core         = { path = "crates/net/core",         version = "0.1.0" }
oath-messaging-core   = { path = "crates/messaging/core",   version = "0.1.0" }
oath-persistence-core = { path = "crates/persistence/core", version = "0.1.0" }
oath-ingest-core      = { path = "crates/ingest/core",      version = "0.1.0" }
oath-execution-core   = { path = "crates/execution/core",   version = "0.1.0" }
oath-portfolio-core   = { path = "crates/portfolio/core",   version = "0.1.0" }
oath-risk-core        = { path = "crates/risk/core",        version = "0.1.0" }
oath-strategy-core    = { path = "crates/strategy/core",    version = "0.1.0" }

# External shared — backend-specific deps belong in individual crate Cargo.toml files
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

# --- Lints ---
# Centralized lint configuration inherited by all workspace crates via `[lints] workspace = true`.
# Full reference: https://doc.rust-lang.org/cargo/reference/workspaces.html#the-lints-table
[workspace.lints.rust]
unused_imports = "warn"
dead_code = "warn"
missing_docs = "warn"
rust_2018_idioms = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
# Internal workspace crates are not published to crates.io
cargo_common_metadata = { level = "allow", priority = 1 }
# Transitive deps may carry duplicate versions outside our control
multiple_crate_versions = { level = "allow", priority = 1 }
# In the restriction group (not covered by `all`) — catches leftover dbg!() calls
dbg_macro = "warn"
# Panicking in a function that returns Result is always a bug.
panic_in_result_fn = "warn"
# Enforce explicit error handling — no silent panics from unwrap/expect/indexing.
# Test code is exempted via `allow-*-in-tests = true` in .clippy.toml.
unwrap_used      = "warn"
expect_used      = "warn"
indexing_slicing = "warn"
# `arithmetic_side_effects` (overflow/underflow panics) is valuable for financial
# math code but too noisy at the workspace level — enable per-crate as needed.
# `todo` / `unimplemented` / `unreachable` block normal development iteration;
# consider enabling on a crate-by-crate basis once the codebase stabilises.

# --- Profiles ---
# Full reference: https://doc.rust-lang.org/cargo/reference/profiles.html
#
# [profile.dev] is intentionally omitted — Cargo defaults are ideal for development:
#   opt-level=0  debug=true  overflow-checks=true  debug-assertions=true
#   incremental=true  codegen-units=256  panic="unwind"
[profile.release]
# (Default: false) — whole-program optimization for maximum runtime performance.
lto = "fat"
# (Default: 16) — single codegen unit required for full LTO effectiveness.
codegen-units = 1
# (Default: "unwind") — abort on panic in production; eliminates unwinding overhead.
panic = "abort"
# (Default: "none") — strip all symbols to minimize binary size in production.
strip = "symbols"

# Profiling: release-level performance with debug symbols and without LTO,
# for faster iterative builds and human-readable profiler output (perf, flamegraph).
[profile.profiling]
inherits = "release"
# (Default in release: false) — full debug info for stack trace resolution.
debug = true
# (Default in release: "symbols") — keep symbols for profiler resolution.
strip = "none"
# (Default in release: "fat") — disabled to speed up iterative profiling builds.
lto = false
# (Default in release: false) — incremental compilation for faster iteration.
incremental = true

# Bench: same rationale as profiling — release optimizations with debug symbols
# so that cargo-flamegraph and similar tools produce readable stack traces.
# Note: Cargo ignores the `panic` setting for bench (harness requires unwind).
[profile.bench]
inherits = "release"
# (Default in release: false) — full debug info for stack trace resolution.
debug = true
# (Default in release: "symbols") — keep symbols for profilers.
strip = "none"
# (Default in release: "fat") — disabled to speed up benchmark compilation.
lto = false
# (Default in release: false) — incremental compilation for faster iteration.
incremental = true
